[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; DTR=1 così HWCDC trasmette; RTS=0 nessun reset (USB nativo, no bridge UART)
monitor_rts = 0
monitor_dtr = 1

; deep+ valuta gli #ifdef così l'LDF trova WebServer.h richiesto da WiFiManager
lib_ldf_mode = deep+

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -Wall
    -Wextra

lib_deps =
    ; lib builtin del framework richieste da WiFiManager (LDF non le aggancia da solo)
    WiFi
    WebServer
    DNSServer
    ESPmDNS
    Update
    FS
    adafruit/Adafruit ADS1X15
    adafruit/Adafruit PCD8544 Nokia 5110 LCD library
    adafruit/Adafruit GFX Library
    bblanchon/ArduinoJson
    ayushsharma82/ElegantOTA
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    tzapu/WiFiManager
    knolleary/PubSubClient

; ============================================================================
; Native test environment (host PC) — logica pura, niente Arduino.
; Esegue: pio test -e native
; ============================================================================
[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter = -<*> +<thermostat_logic.c> +<alarm_logic.c> +<sensor_fusion.c>
build_flags = -std=c11 -Wall -Wextra -I src -lm

