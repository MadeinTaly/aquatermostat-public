name: Frontend Tests

on:
  push:
    paths:
      - 'web/**'
      - 'src/webpage.h'
      - '.github/workflows/fe-tests.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'src/webpage.h'
      - '.github/workflows/fe-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Frontend Tests
        run: node --test web/*.test.mjs
